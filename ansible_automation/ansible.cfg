[defaults]
# Basic Configuration
inventory = ./inventory/inventory.yml
host_key_checking = False
retry_files_enabled = False
deprecation_warnings = False
command_warnings = False

# Timeout settings for network devices
timeout = 60
connect_timeout = 60

# Logging
log_path = ./ansible.log

# Performance tuning
forks = 10
gathering = explicit

# SSH Configuration
[ssh_connection]
# Disable SSH pipelining for network devices
pipelining = False

# Connection timeout for SSH
connect_timeout = 60
connect_retry_timeout = 60

# Keep connection alive
ssh_args = -o ServerAliveInterval=60 -o ServerAliveCountMax=3

[persistent_connection]
# Persistent connection timeout for network devices (in seconds)
connect_timeout = 60
connect_retry_timeout = 60
command_timeout = 60

[privilege_escalation]
become = False
become_method = enable
become_user = None
become_ask_pass = False